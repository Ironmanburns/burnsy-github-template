# PR teardown — delete ephemeral preview when PR closes/merges.
pipeline:
  name: PR Teardown __APP_NAME__
  identifier: PR_Teardown___APP_ID__
  projectIdentifier: __HARNESS_PROJECT__
  orgIdentifier: __HARNESS_ORG__
  tags:
    app: __APP_NAME__
    deploy: pr-teardown
  stages:
    - stage:
        name: Teardown
        identifier: Teardown
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Delete preview namespace
                  identifier: Delete_preview_ns
                  timeout: 5m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e
                          NS="samples-pr-__APP_NAME__-<+trigger.prNumber>"
                          echo "Deleting namespace ${NS} (if present)"
                          kubectl delete namespace "${NS}" --ignore-not-found
                    onDelegate: true
                    delegateSelectors:
                      - local-kind
